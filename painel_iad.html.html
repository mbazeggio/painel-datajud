<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRT12 · Painel de Desempenho</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#1E2761; --navy2:#141B4A; --gold:#E6A817;
  --blue:#2563EB; --teal:#0891B2; --purple:#7C3AED;
  --green:#16A34A; --red:#DC2626; --amber:#D97706;
  --bg:#F1F5F9; --surf:#FFFFFF; --brd:#E2E8F0;
  --text:#1E293B; --muted:#64748B; --light:#94A3B8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

header{background:var(--navy2);height:62px;padding:0 2rem;display:flex;align-items:center;gap:1.2rem;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:100;}
.hbadge{background:var(--gold);color:var(--navy2);font-weight:700;font-size:.75rem;padding:3px 10px;border-radius:3px;letter-spacing:1px;}
header h1{color:#fff;font-size:1rem;font-weight:600;}
header h1 span{color:var(--gold);}
.periodo{margin-left:auto;color:var(--light);font-size:.78rem;font-family:'DM Mono',monospace;}

.controls{background:var(--surf);border-bottom:1px solid var(--brd);padding:.9rem 2rem;display:flex;gap:2rem;align-items:flex-end;flex-wrap:wrap;}
.ctrl{display:flex;flex-direction:column;gap:.35rem;}
.ctrl-lbl{font-size:.68rem;font-weight:700;color:var(--light);letter-spacing:1.2px;text-transform:uppercase;}

.seg-tabs{display:flex;gap:.35rem;}
.seg-tab{padding:6px 15px;border-radius:6px;border:2px solid var(--brd);background:transparent;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;}
.seg-tab:hover{border-color:var(--navy);color:var(--navy);}
.seg-tab.at-1gc{background:var(--blue);border-color:var(--blue);color:#fff;}
.seg-tab.at-1ge{background:var(--teal);border-color:var(--teal);color:#fff;}
.seg-tab.at-2g{background:var(--purple);border-color:var(--purple);color:#fff;}

.tipo-wrap{display:flex;gap:.4rem;flex-wrap:wrap;}
.tipo-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;border:2px solid var(--brd);font-size:.79rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none;background:var(--surf);}
.tipo-pill:hover{border-color:var(--navy);color:var(--navy);}
.tipo-pill.on{border-color:var(--blue);background:#EFF6FF;color:var(--blue);}
.tipo-pill.on .pdot{background:var(--blue);}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--brd);flex-shrink:0;transition:background .15s;}

.search-input{padding:6px 12px;border:2px solid var(--brd);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.82rem;width:200px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--blue);}

.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.85rem;padding:1.1rem 2rem 0;}
.kpi{background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:.85rem 1rem;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.kpi.c-blue::after{background:var(--blue);}
.kpi.c-red::after{background:#EF4444;}
.kpi.c-amber::after{background:var(--amber);}
.kpi.c-teal::after{background:var(--teal);}
.kpi.c-purple::after{background:var(--purple);}
.kpi-lbl{font-size:.67rem;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.1rem;}
.kpi-lbl2{font-size:.63rem;color:var(--light);margin-bottom:.3rem;font-style:italic;}
.kpi-val{font-size:1.45rem;font-weight:700;color:var(--text);line-height:1.1;}
.kpi-val.good{color:var(--green);}.kpi-val.warn{color:var(--amber);}.kpi-val.bad{color:var(--red);}
.kpi-sub{font-size:.72rem;color:var(--light);margin-top:.2rem;}

.pont-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;padding:.6rem 2rem 1.1rem;}
.pont-card{background:var(--navy2);border-radius:8px;padding:.85rem 1.2rem;display:flex;align-items:center;gap:1rem;}
.pont-icon{font-size:1.6rem;line-height:1;}
.pont-info{display:flex;flex-direction:column;}
.pont-lbl{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.8px;}
.pont-val{font-size:1.6rem;font-weight:700;color:#fff;line-height:1.1;}
.pont-val.dest{color:var(--gold);}
.pont-sub{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:.1rem;}

.tbl-wrap{padding:0 2rem 2.5rem;}
.tbl-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.tbl-title{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
.tbl-count{background:var(--bg);border:1px solid var(--brd);border-radius:20px;padding:2px 12px;font-size:.75rem;color:var(--muted);font-family:'DM Mono',monospace;}

table{width:100%;border-collapse:collapse;background:var(--surf);border-radius:10px;overflow:hidden;border:1px solid var(--brd);font-size:.83rem;}
thead tr{background:var(--navy);}
th{padding:10px 12px;text-align:left;color:rgba(255,255,255,.65);font-size:.68rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none;transition:color .1s;}
th:hover{color:var(--gold);}
th.asc::after{content:' ↑';color:var(--gold);}
th.desc::after{content:' ↓';color:var(--gold);}
tbody tr{border-bottom:1px solid var(--brd);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#F8FAFC;}
td{padding:9px 12px;vertical-align:middle;}
td.nome{font-weight:600;}
td.muni{color:var(--muted);font-size:.79rem;}

.tbadge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.68rem;font-weight:700;}
.tb-vara{background:#EFF6FF;color:var(--blue);}
.tb-gab{background:#F5F3FF;color:var(--purple);}
.tb-cejusc{background:#ECFDF5;color:var(--green);}
.tb-outro{background:#F8FAFC;color:var(--muted);}

td.num{font-family:'DM Mono',monospace;font-size:.8rem;text-align:right;color:var(--muted);}
td.num.dest{color:var(--text);font-weight:600;}

.ind-cell{min-width:110px;}
.ind-row{display:flex;align-items:center;gap:7px;}
.ind-val{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:700;min-width:52px;}
.ind-val.good{color:var(--green);}.ind-val.warn{color:var(--amber);}.ind-val.bad{color:var(--red);}.ind-val.null{color:var(--light);font-weight:400;}
.bar{flex:1;height:5px;background:var(--brd);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-fill.good{background:var(--green);}.bar-fill.warn{background:var(--amber);}.bar-fill.bad{background:var(--red);}

.empty td{text-align:center;padding:3rem;color:var(--light);font-style:italic;}
footer{text-align:center;padding:1.2rem;font-size:.72rem;color:var(--light);border-top:1px solid var(--brd);}
.ext-link{display:inline-flex;align-items:center;gap:.5rem;padding:6px 16px;background:var(--gold);color:var(--navy2);font-weight:700;font-size:.78rem;border-radius:6px;text-decoration:none;letter-spacing:.3px;transition:opacity .15s;}
.ext-link:hover{opacity:.85;}
.ext-link svg{flex-shrink:0;}
</style>
</head>

// ── HELPERS ───────────────────────────────────────────────────────────────
function fmt(v, d) {
  if (v == null) return '–';
  d = d != null ? d : 1;
  return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtN(v) {
  if (v == null || v === 0) return '–';
  return Number(v).toLocaleString('pt-BR', {maximumFractionDigits:0});
}
function iadCls(v) { return v==null?'null':v>=100?'good':v>=80?'warn':'bad'; }
function tclCls(v) { return v==null?'null':v<=35?'good':v<=50?'warn':'bad'; }
function tipoBadge(t) {
  if (t === 'Vara') return 'tbadge tb-vara';
  if (t.indexOf('Gabinete') >= 0) return 'tbadge tb-gab';
  if (t === 'CEJUSC') return 'tbadge tb-cejusc';
  return 'tbadge tb-outro';
}
function pontua(iad, tcl) {
  if (iad == null) return false;
  if (iad >= 100.0) return true;
  if (iad >= 90.0 && tcl != null && tcl < 25.0) return true;
  return false;
}
// GAP IAD 100%: saídas que faltaram para IAD = 100%
function calcGap100(entrada, saida) {
  if (entrada == null || saida == null) return null;
  return Math.max(0, Math.round(entrada - saida));
}

// GAP IAD 90%: saídas que faltaram para IAD = 90%
function calcGap90(entrada, saida) {
  if (entrada == null || saida == null) return null;
  return Math.max(0, Math.round(entrada * 0.9 - saida));
}

// GAP TCL 25%: saídas adicionais necessárias para TCL = 25%
// Gap = pend - (pend + saida) / 4
function calcGapTCL(saida, pend) {
  if (saida == null || pend == null) return null;
  return Math.max(0, Math.round(pend - (pend + saida) / 4));
}

// ── TIPOS DISPONÍVEIS ─────────────────────────────────────────────────────
function tiposDisponiveis() {
  var s = new Set();
  for (var i = 0; i < RAW.length; i++) {
    if (segs.has(RAW[i].segmento)) s.add(RAW[i].tipo_unidade);
  }
  return Array.from(s).sort();
}

// ── TABS DE SEGMENTO ──────────────────────────────────────────────────────
document.getElementById('seg-tabs').addEventListener('click', function(e) {
  var btn = e.target.closest('.seg-tab');
  if (!btn) return;
  var s = btn.dataset.seg;
  if (segs.has(s)) {
    if (segs.size === 1) return;
    segs.delete(s);
    btn.className = 'seg-tab';
  } else {
    segs.add(s);
    btn.className = 'seg-tab ' + SEG_COR[s];
  }
  // Atualizar tipos: manter os que ainda existem + adicionar novos
  var disp = new Set(tiposDisponiveis());
  var novo = new Set();
  tipos.forEach(function(t) { if (disp.has(t)) novo.add(t); });
  disp.forEach(function(t) { novo.add(t); });
  tipos = novo;
  buildTipos();
  sortKey = 'nome'; sortDir = 'asc';
  render();
});

// ── CHECKBOXES DE TIPO ────────────────────────────────────────────────────
function buildTipos() {
  var wrap = document.getElementById('tipo-wrap');
  wrap.innerHTML = '';
  var lista = tiposDisponiveis();
  for (var i = 0; i < lista.length; i++) {
    (function(t) {
      var pill = document.createElement('span');
      pill.className = 'tipo-pill' + (tipos.has(t) ? ' on' : '');
      pill.innerHTML = '<span class="pdot"></span>' + t;
      pill.addEventListener('click', function() {
        if (tipos.has(t)) { tipos.delete(t); pill.classList.remove('on'); }
        else              { tipos.add(t);    pill.classList.add('on'); }
        render();
      });
      wrap.appendChild(pill);
    })(lista[i]);
  }
}

document.getElementById('search').addEventListener('input', render);

// ── FILTRO + AGREGAÇÃO ────────────────────────────────────────────────────
function filtered() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var base = [];
  for (var i = 0; i < RAW.length; i++) {
    var r = RAW[i];
    if (!segs.has(r.segmento)) continue;
    if (!tipos.has(r.tipo_unidade)) continue;
    if (q) {
      var nome = r.orgao_julgador.toLowerCase();
      var muni = (r.municipio_oj || '').toLowerCase();
      if (nome.indexOf(q) < 0 && muni.indexOf(q) < 0) continue;
    }
    base.push(r);
  }

  if (segs.size === 1) return base;

  // Múltiplos segmentos: 1 linha por unidade (somatório)
  var map = {};
  for (var j = 0; j < base.length; j++) {
    var r = base[j];
    var id = r.id_orgao_julgador;
    if (!map[id]) {
      map[id] = {
        id_orgao_julgador: id,
        orgao_julgador: r.orgao_julgador,
        municipio_oj:   r.municipio_oj,
        tipo_unidade:   r.tipo_unidade,
        segmento: 'multi',
        entrada: 0, saida: 0, pend_final: 0, iad: null, tcl: null
      };
    }
    map[id].entrada    += r.entrada    || 0;
    map[id].saida      += r.saida      || 0;
    map[id].pend_final += r.pend_final || 0;
  }

  var result = [];
  for (var id in map) {
    var r = map[id];
    r.iad = r.entrada > 0 ? Math.round(r.saida   / r.entrada * 1000) / 10 : null;
    r.tcl = (r.pend_final + r.saida) > 0
      ? Math.round(r.pend_final / (r.pend_final + r.saida) * 1000) / 10 : null;
    result.push(r);
  }
  return result;
}

// ── ORDENAÇÃO ─────────────────────────────────────────────────────────────
function sortedData(data) {
  return data.slice().sort(function(a, b) {
    var va, vb;
    if (sortKey === 'nome') { va = a.orgao_julgador || ''; vb = b.orgao_julgador || ''; }
    else if (sortKey === 'muni') { va = a.municipio_oj || ''; vb = b.municipio_oj || ''; }
    else if (sortKey === 'pend') { va = a.pend_final != null ? a.pend_final : -1; vb = b.pend_final != null ? b.pend_final : -1; }
    else if (sortKey === 'gap100') {
      va = calcGap100(a.entrada, a.saida); va = va != null ? va : 999999999;
      vb = calcGap100(b.entrada, b.saida); vb = vb != null ? vb : 999999999;
    }
    else if (sortKey === 'gap90') {
      va = calcGap90(a.entrada, a.saida); va = va != null ? va : 999999999;
      vb = calcGap90(b.entrada, b.saida); vb = vb != null ? vb : 999999999;
    }
    else if (sortKey === 'gaptcl') {
      va = calcGapTCL(a.saida, a.pend_final); va = va != null ? va : 999999999;
      vb = calcGapTCL(b.saida, b.pend_final); vb = vb != null ? vb : 999999999;
    }
    else { va = a[sortKey] != null ? a[sortKey] : -1; vb = b[sortKey] != null ? b[sortKey] : -1; }
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb,'pt-BR') : vb.localeCompare(va,'pt-BR');
    return sortDir === 'asc' ? va - vb : vb - va;
  });
}

// ── CABEÇALHO DA TABELA ───────────────────────────────────────────────────
function buildHead() {
  var tr = document.getElementById('thead-row');
  var html = '';
  for (var i = 0; i < COLS.length; i++) {
    var c = COLS[i];
    if (c.nosort) {
      html += '<th style="text-align:' + c.align + '">' + c.label + '</th>';
    } else {
      var cls = sortKey === c.key ? sortDir : '';
      html += '<th class="' + cls + '" data-key="' + c.key + '" style="text-align:' + c.align + '">' + c.label + '</th>';
    }
  }
  tr.innerHTML = html;
  var ths = tr.querySelectorAll('th[data-key]');
  for (var j = 0; j < ths.length; j++) {
    (function(th) {
      th.addEventListener('click', function() {
        var k = th.dataset.key;
        if (sortKey === k) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
        else { sortKey = k; sortDir = (k === 'nome' || k === 'muni') ? 'asc' : 'desc'; }
        render();
      });
    })(ths[j]);
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  var data = sortedData(filtered());
  buildHead();

  // Título
  var segLbls = Array.from(segs).map(function(s) { return SEG_LABEL[s]; }).join(' + ');
  document.getElementById('tbl-title').textContent = segLbls.toUpperCase() + ' · ÓRGÃOS JULGADORES';
  document.getElementById('tbl-count').textContent = data.length + ' unidades';

  // Totais para KPIs
  var ENT = 0, SAI = 0, PEND = 0;
  for (var i = 0; i < data.length; i++) {
    ENT  += data[i].entrada    || 0;
    SAI  += data[i].saida      || 0;
    PEND += data[i].pend_final || 0;
  }
  var iadG = ENT  > 0 ? SAI  / ENT  * 100 : null;
  var tclG = (PEND + SAI) > 0 ? PEND / (PEND + SAI) * 100 : null;

  // KPIs
  var kpiEl = document.getElementById('kpi-grid');
  kpiEl.innerHTML =
    '<div class="kpi c-blue"><div class="kpi-lbl">Entrada</div><div class="kpi-lbl2">ago/2025–fev/2026</div><div class="kpi-val">' + fmtN(ENT) + '</div></div>' +
    '<div class="kpi c-red"><div class="kpi-lbl">Saída</div><div class="kpi-lbl2">ago/2025–fev/2026</div><div class="kpi-val">' + fmtN(SAI) + '</div></div>' +
    '<div class="kpi c-amber"><div class="kpi-lbl">Pend. Líquido</div><div class="kpi-lbl2">fev/2026 (últ. mês)</div><div class="kpi-val">' + fmtN(PEND) + '</div></div>' +
    '<div class="kpi c-teal"><div class="kpi-lbl">IAD</div><div class="kpi-lbl2">ago/2025–fev/2026</div><div class="kpi-val ' + iadCls(iadG) + '">' + (iadG != null ? fmt(iadG) + '%' : '–') + '</div><div class="kpi-sub">meta ≥ 100%</div></div>' +
    '<div class="kpi c-purple"><div class="kpi-lbl">TCL</div><div class="kpi-lbl2">mar/2025–fev/2026</div><div class="kpi-val ' + tclCls(tclG) + '">' + (tclG != null ? fmt(tclG) + '%' : '–') + '</div><div class="kpi-sub">menor = melhor</div></div>';

  // Cards de pontuação
  var nSim = 0;
  for (var i = 0; i < data.length; i++) {
    if (pontua(data[i].iad, data[i].tcl)) nSim++;
  }
  var indice = data.length > 0 ? nSim / data.length * 100 : null;
  var pontEl = document.getElementById('pont-bar');
  pontEl.innerHTML =
    '<div class="pont-card"><span class="pont-icon">🏛️</span><div class="pont-info"><span class="pont-lbl">Total de Unidades</span><span class="pont-val">' + data.length + '</span><span class="pont-sub">no filtro atual</span></div></div>' +
    '<div class="pont-card"><span class="pont-icon">✅</span><div class="pont-info"><span class="pont-lbl">Unidades que Pontuam</span><span class="pont-val dest">' + nSim + '</span><span class="pont-sub">IAD ≥ 100% ou IAD ≥ 90% + TCL &lt; 25%</span></div></div>' +
    '<div class="pont-card"><span class="pont-icon">📊</span><div class="pont-info"><span class="pont-lbl">Índice de Pontuação</span><span class="pont-val dest">' + (indice != null ? fmt(indice) + '%' : '–') + '</span><span class="pont-sub">unidades que pontuam / total</span></div></div>';

  // Tabela vazia
  var tbody = document.getElementById('tbody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr class="empty"><td colspan="12">Nenhuma unidade encontrada.</td></tr>';
    return;
  }

  // Máximos para barras
  var maxIAD = 120, maxTCL = 100;
  for (var i = 0; i < data.length; i++) {
    if (data[i].iad && data[i].iad > maxIAD) maxIAD = data[i].iad;
    if (data[i].tcl && data[i].tcl > maxTCL) maxTCL = data[i].tcl;
  }

  // Linhas
  var rows = '';
  for (var i = 0; i < data.length; i++) {
    var r   = data[i];
    var ic  = iadCls(r.iad);
    var tc  = tclCls(r.tcl);
    var iW  = r.iad != null ? Math.min(r.iad / maxIAD * 100, 100).toFixed(1) : 0;
    var tW  = r.tcl != null ? Math.min(r.tcl / maxTCL * 100, 100).toFixed(1) : 0;
    var g100  = calcGap100(r.entrada, r.saida);
    var g90   = calcGap90(r.entrada, r.saida);
    var gTCL  = calcGapTCL(r.saida, r.pend_final);
    function mkGapCell(v, cor) {
      return v == null ? '–'
        : v === 0
          ? '<span style="font-size:.72rem;color:var(--green);font-weight:700">✓</span>'
          : '<span style="font-family:DM Mono,monospace;font-size:.82rem;font-weight:600;color:' + cor + '">+' + Number(v).toLocaleString('pt-BR') + '</span>';
    }
    var g100Cell = mkGapCell(g100, 'var(--amber)');
    var g90Cell  = mkGapCell(g90,  'var(--amber)');
    var gTCLCell = mkGapCell(gTCL, 'var(--red)');
    var simCell = pontua(r.iad, r.tcl)
      ? '<span style="display:inline-block;padding:2px 10px;border-radius:4px;font-size:.72rem;font-weight:700;background:#DCFCE7;color:var(--green)">SIM</span>'
      : '<span style="color:var(--light)">–</span>';

    rows +=
      '<tr>' +
      '<td class="nome">' + r.orgao_julgador + '</td>' +
      '<td class="muni">' + (r.municipio_oj || '–') + '</td>' +
      '<td><span class="' + tipoBadge(r.tipo_unidade) + '">' + r.tipo_unidade + '</span></td>' +
      '<td class="num dest">' + fmtN(r.entrada) + '</td>' +
      '<td class="num dest">' + fmtN(r.saida) + '</td>' +
      '<td class="num dest">' + fmtN(r.pend_final) + '</td>' +
      '<td class="ind-cell"><div class="ind-row"><span class="ind-val ' + ic + '">' + (r.iad != null ? fmt(r.iad) + '%' : '–') + '</span><div class="bar"><div class="bar-fill ' + ic + '" style="width:' + iW + '%"></div></div></div></td>' +
      '<td class="ind-cell"><div class="ind-row"><span class="ind-val ' + tc + '">' + (r.tcl != null ? fmt(r.tcl) + '%' : '–') + '</span><div class="bar"><div class="bar-fill ' + tc + '" style="width:' + tW + '%"></div></div></div></td>' +
      '<td class="num">' + g100Cell + '</td>' +
      '<td class="num">' + g90Cell  + '</td>' +
      '<td class="num">' + gTCLCell + '</td>' +
      '<td style="text-align:center">' + simCell + '</td>' +
      '</tr>';
  }
  tbody.innerHTML = rows;
}

// ── INIT ──────────────────────────────────────────────────────────────────
tipos = new Set(tiposDisponiveis());
buildTipos();
render();
</script>
