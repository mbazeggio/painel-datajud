<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRT12 · Painel de Desempenho</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:   #1E2761;
  --navy2:  #141B4A;
  --gold:   #E6A817;
  --blue:   #2563EB;
  --teal:   #0891B2;
  --purple: #7C3AED;
  --green:  #16A34A;
  --red:    #DC2626;
  --amber:  #D97706;
  --bg:     #F1F5F9;
  --surf:   #FFFFFF;
  --brd:    #E2E8F0;
  --text:   #1E293B;
  --muted:  #64748B;
  --light:  #94A3B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header {
  background: var(--navy2);
  height: 62px; padding: 0 2rem;
  display: flex; align-items: center; gap: 1.2rem;
  border-bottom: 3px solid var(--gold);
  position: sticky; top: 0; z-index: 100;
}
.hbadge { background: var(--gold); color: var(--navy2); font-weight: 700; font-size: 0.75rem; padding: 3px 10px; border-radius: 3px; letter-spacing: 1px; }
header h1 { color: #fff; font-size: 1rem; font-weight: 600; }
header h1 span { color: var(--gold); }
.periodo { margin-left: auto; color: var(--light); font-size: 0.78rem; font-family: 'DM Mono', monospace; }

.controls {
  background: var(--surf); border-bottom: 1px solid var(--brd);
  padding: 0.9rem 2rem; display: flex; gap: 2rem; align-items: flex-end; flex-wrap: wrap;
}
.ctrl { display: flex; flex-direction: column; gap: 0.35rem; }
.ctrl-lbl { font-size: 0.68rem; font-weight: 700; color: var(--light); letter-spacing: 1.2px; text-transform: uppercase; }

.seg-tabs { display: flex; gap: 0.35rem; }
.seg-tab {
  padding: 6px 15px; border-radius: 6px; border: 2px solid var(--brd);
  background: transparent; font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.15s;
}
.seg-tab:hover { border-color: var(--navy); color: var(--navy); }
.seg-tab.at-1gc { background: var(--blue);   border-color: var(--blue);   color: #fff; }
.seg-tab.at-1ge { background: var(--teal);   border-color: var(--teal);   color: #fff; }
.seg-tab.at-2g  { background: var(--purple); border-color: var(--purple); color: #fff; }
.seg-tab.at-1gc.off, .seg-tab.at-1ge.off, .seg-tab.at-2g.off { background: transparent; color: var(--muted); }

.tipo-wrap { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.tipo-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 13px; border-radius: 20px; border: 2px solid var(--brd);
  font-size: 0.79rem; font-weight: 500; color: var(--muted);
  cursor: pointer; transition: all 0.15s; user-select: none; background: var(--surf);
}
.tipo-pill:hover { border-color: var(--navy); color: var(--navy); }
.tipo-pill.on { border-color: var(--blue); background: #EFF6FF; color: var(--blue); }
.tipo-pill.on .pdot { background: var(--blue); }
.pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--brd); flex-shrink: 0; transition: background 0.15s; }

.search-input {
  padding: 6px 12px; border: 2px solid var(--brd); border-radius: 6px;
  font-family: 'DM Sans', sans-serif; font-size: 0.82rem; width: 200px; outline: none; transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--blue); }

.kpi-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.85rem; padding: 1.1rem 2rem 0;
}
.pont-bar {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem;
  padding: 0.6rem 2rem 1.1rem; background: transparent;
}
.pont-card {
  background: var(--navy2); border-radius: 8px; padding: 0.85rem 1.2rem;
  display: flex; align-items: center; gap: 1rem;
}
.pont-icon { font-size: 1.6rem; line-height: 1; }
.pont-info { display: flex; flex-direction: column; }
.pont-lbl { font-size: 0.68rem; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.8px; }
.pont-val { font-size: 1.6rem; font-weight: 700; color: #fff; line-height: 1.1; }
.pont-sub { font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-top: 0.1rem; }
.pont-val.destaque { color: var(--gold); }
.kpi {
  background: var(--surf); border: 1px solid var(--brd); border-radius: 8px;
  padding: 0.85rem 1rem; position: relative; overflow: hidden;
}
.kpi::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi.c-blue::after   { background: var(--blue);   }
.kpi.c-blue2::after  { background: #60A5FA;        }
.kpi.c-red::after    { background: #EF4444;        }
.kpi.c-amber::after  { background: var(--amber);   }
.kpi.c-teal::after   { background: var(--teal);    }
.kpi.c-purple::after { background: var(--purple);  }
.kpi-lbl  { font-size: 0.67rem; font-weight: 700; color: var(--light); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 0.1rem; }
.kpi-lbl2 { font-size: 0.63rem; color: var(--light); margin-bottom: 0.3rem; font-style: italic; }
.kpi-val  { font-size: 1.45rem; font-weight: 700; color: var(--text); line-height: 1.1; }
.kpi-val.good { color: var(--green); } .kpi-val.warn { color: var(--amber); } .kpi-val.bad { color: var(--red); }
.kpi-sub  { font-size: 0.72rem; color: var(--light); margin-top: 0.2rem; }

.tbl-wrap { padding: 0 2rem 2.5rem; }
.tbl-hdr  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
.tbl-title { font-size: 0.78rem; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
.tbl-count { background: var(--bg); border: 1px solid var(--brd); border-radius: 20px; padding: 2px 12px; font-size: 0.75rem; color: var(--muted); font-family: 'DM Mono', monospace; }

table { width: 100%; border-collapse: collapse; background: var(--surf); border-radius: 10px; overflow: hidden; border: 1px solid var(--brd); font-size: 0.83rem; }
thead tr { background: var(--navy); }
th {
  padding: 10px 12px; text-align: left; color: rgba(255,255,255,0.65);
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  cursor: pointer; white-space: nowrap; user-select: none; transition: color 0.1s;
}
th:hover { color: var(--gold); }
th.asc::after  { content: ' ↑'; color: var(--gold); }
th.desc::after { content: ' ↓'; color: var(--gold); }
tbody tr { border-bottom: 1px solid var(--brd); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #F8FAFC; }
td { padding: 9px 12px; vertical-align: middle; }
td.nome { font-weight: 600; }
td.muni { color: var(--muted); font-size: 0.79rem; }

.tbadge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; }
.tb-vara  { background: #EFF6FF; color: var(--blue);   }
.tb-gab   { background: #F5F3FF; color: var(--purple); }
.tb-cejusc{ background: #ECFDF5; color: var(--green);  }
.tb-outro { background: #F8FAFC; color: var(--muted);  }

td.num { font-family: 'DM Mono', monospace; font-size: 0.8rem; text-align: right; color: var(--muted); }
td.num.dest { color: var(--text); font-weight: 600; }

.ind-cell { min-width: 110px; }
.ind-row  { display: flex; align-items: center; gap: 7px; }
.ind-val  { font-family: 'DM Mono', monospace; font-size: 0.82rem; font-weight: 700; min-width: 52px; }
.ind-val.good { color: var(--green); } .ind-val.warn { color: var(--amber); }
.ind-val.bad  { color: var(--red);   } .ind-val.null { color: var(--light); font-weight: 400; }
.bar      { flex: 1; height: 5px; background: var(--brd); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; }
.bar-fill.good { background: var(--green); } .bar-fill.warn { background: var(--amber); } .bar-fill.bad { background: var(--red); }

.empty td { text-align: center; padding: 3rem; color: var(--light); font-style: italic; }
.pont-row { display: flex; gap: 0.85rem; padding: 0 2rem 1rem; }
.pont-card { background: var(--surf); border: 1px solid var(--brd); border-radius: 8px; padding: 0.7rem 1.4rem; min-width: 160px; }
.pont-card.pont-sim { border-color: #86EFAC; background: #F0FDF4; }
.pont-card.pont-pct { border-color: #86EFAC; background: #F0FDF4; }
.pont-lbl { font-size: 0.68rem; font-weight: 700; color: var(--light); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 0.2rem; }
.pont-val { font-size: 1.6rem; font-weight: 700; color: var(--text); }
.pont-card.pont-sim .pont-val, .pont-card.pont-pct .pont-val { color: var(--green); }

footer { text-align: center; padding: 1.2rem; font-size: 0.72rem; color: var(--light); border-top: 1px solid var(--brd); }
</style>
</head>
<body>

<header>
  <span class="hbadge">TRT12</span>
  <h1>Painel de Desempenho · <span>12ª Região</span></h1>
  <span class="periodo">mar/2025 – fev/2026</span>
</header>

<div class="controls">
  <div class="ctrl">
    <span class="ctrl-lbl">Segmento</span>
    <div class="seg-tabs" id="seg-tabs">
      <button class="seg-tab at-1gc" data-seg="1gc">1º Grau Conhecimento</button>
      <button class="seg-tab at-1ge" data-seg="1ge">1º Grau Execução</button>
      <button class="seg-tab at-2g" data-seg="2g">2º Grau</button>
    </div>
  </div>
  <div class="ctrl">
    <span class="ctrl-lbl">Tipo de Unidade</span>
    <div class="tipo-wrap" id="tipo-wrap"></div>
  </div>
  <div class="ctrl">
    <span class="ctrl-lbl">Buscar</span>
    <input class="search-input" id="search" type="text" placeholder="Nome ou município...">
  </div>
</div>

<div class="kpi-grid" id="kpi-grid"></div>
<div class="pont-bar" id="pont-bar"></div>

<div class="pont-row" id="pont-bar"></div>
<div class="tbl-wrap">
  <div class="tbl-hdr">
    <span class="tbl-title" id="tbl-title">ÓRGÃOS JULGADORES</span>
    <span class="tbl-count" id="tbl-count">–</span>
  </div>
  <table>
    <thead><tr id="thead-row"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<footer>Fonte: CNJ · Dados processuais mar/2025 – fev/2026 · TRT12 – Tribunal Regional do Trabalho da 12ª Região · Santa Catarina</footer>

// ── Estado ────────────────────────────────────────────────────────────────
var segs    = new Set(['1gc']);   // segmentos ativos (múltipla escolha)
var tipos   = new Set();
var sortKey = 'nome';
var sortDir = 'asc';

var SEG_LABEL = { '1gc':'1º Grau Conhecimento', '1ge':'1º Grau Execução', '2g':'2º Grau' };
var SEG_COR   = { '1gc':'at-1gc', '1ge':'at-1ge', '2g':'at-2g' };

var COLS = [
  { key:'nome',  label:'Órgão Julgador',          align:'left'   },
  { key:'muni',  label:'Município',                align:'left'   },
  { key:'tipo',  label:'Tipo',                     align:'left',  nosort:true },
  { key:'ind1',  label:'Entrada Distribuição',     align:'right'  },
  { key:'ind20', label:'Entrada Redistribuição',   align:'right'  },
  { key:'ind3',  label:'Saída Baixa',              align:'right'  },
  { key:'ind21', label:'Saída Redistribuição',     align:'right'  },
  { key:'iad',   label:'IAD',                      align:'left'   },
  { key:'tcl',   label:'TCL',                      align:'left'   },
  { key:'pont',  label:'Pontuação',                align:'center', nosort:true },
];

// ── Tipos disponíveis nos segs ativos ─────────────────────────────────────
function tiposDisponiveis() {
  var set = new Set();
  RAW.forEach(function(r) { if (segs.has(r.segmento)) set.add(r.tipo_unidade); });
  return Array.from(set).sort();
}

// ── Tabs de segmento (múltipla escolha) ───────────────────────────────────
document.getElementById('seg-tabs').addEventListener('click', function(e) {
  var btn = e.target.closest('.seg-tab');
  if (!btn) return;
  var s = btn.dataset.seg;
  if (segs.has(s)) {
    if (segs.size === 1) return;   // pelo menos 1 ativo
    segs.delete(s);
    btn.className = 'seg-tab';
  } else {
    segs.add(s);
    btn.className = 'seg-tab ' + SEG_COR[s];
  }
  // Reconstruir tipos mantendo os que ainda existem
  var disponiveis = new Set(tiposDisponiveis());
  var novosTipos  = new Set();
  tipos.forEach(function(t) { if (disponiveis.has(t)) novosTipos.add(t); });
  // Adicionar novos tipos que apareceram
  disponiveis.forEach(function(t) { novosTipos.add(t); });
  tipos = novosTipos;
  buildTipos();
  sortKey = 'nome'; sortDir = 'asc';
  render();
});

// ── Checkboxes de tipo ────────────────────────────────────────────────────
function buildTipos() {
  var wrap = document.getElementById('tipo-wrap');
  wrap.innerHTML = '';
  tiposDisponiveis().forEach(function(t) {
    var pill = document.createElement('span');
    pill.className = 'tipo-pill' + (tipos.has(t) ? ' on' : '');
    pill.innerHTML = '<span class="pdot"></span>' + t;
    pill.addEventListener('click', function() {
      if (tipos.has(t)) { tipos.delete(t); pill.classList.remove('on'); }
      else              { tipos.add(t);    pill.classList.add('on');    }
      render();
    });
    wrap.appendChild(pill);
  });
}

document.getElementById('search').addEventListener('input', render);

// ── Dados filtrados e agregados ────────────────────────────────────────────
function filtered() {
  var q = document.getElementById('search').value.toLowerCase().trim();

  var base = RAW.filter(function(r) {
    return segs.has(r.segmento) &&
           tipos.has(r.tipo_unidade) &&
           (!q || r.orgao_julgador.toLowerCase().indexOf(q) >= 0 ||
                  (r.municipio_oj||'').toLowerCase().indexOf(q) >= 0);
  });

  // Apenas 1 segmento: retornar direto
  if (segs.size === 1) return base;

  // Múltiplos segmentos: 1 linha por unidade com somatório
  var map = {};
  base.forEach(function(r) {
    var id = r.id_orgao_julgador;
    if (!map[id]) {
      map[id] = {
        id_orgao_julgador: id,
        orgao_julgador:    r.orgao_julgador,
        municipio_oj:      r.municipio_oj,
        tipo_unidade:      r.tipo_unidade,
        segmento:          'multi',
        ind1: 0, ind20: 0, ind3: 0, ind21: 0, pend_final: 0,
        iad: null, tcl: null,
      };
    }
    map[id].ind1       += r.ind1       || 0;
    map[id].ind20      += r.ind20      || 0;
    map[id].ind3       += r.ind3       || 0;
    map[id].ind21      += r.ind21      || 0;
    map[id].pend_final += r.pend_final || 0;
  });

  // Recalcular IAD e TCL
  return Object.values(map).map(function(r) {
    var den_iad = r.ind1 + r.ind20;
    var den_tcl = r.pend_final + r.ind3 + r.ind21;
    r.iad = den_iad > 0 ? Math.round((r.ind3 + r.ind21) / den_iad * 1000) / 10 : null;
    r.tcl = den_tcl > 0 ? Math.round(r.pend_final / den_tcl * 1000) / 10 : null;
    return r;
  });
}

// ── Cabeçalho da tabela com ordenação ─────────────────────────────────────
function buildHead() {
  var tr = document.getElementById('thead-row');
  tr.innerHTML = COLS.map(function(c) {
    if (c.nosort) return '<th style="text-align:' + c.align + '">' + c.label + '</th>';
    var cls = sortKey === c.key ? sortDir : '';
    return '<th class="' + cls + '" data-key="' + c.key + '" style="text-align:' + c.align + '">' + c.label + '</th>';
  }).join('');
  tr.querySelectorAll('th[data-key]').forEach(function(th) {
    th.addEventListener('click', function() {
      var k = th.dataset.key;
      if (sortKey === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = k; sortDir = (k === 'nome' || k === 'muni') ? 'asc' : 'desc'; }
      render();
    });
  });
}

function sortedData(data) {
  return data.slice().sort(function(a, b) {
    var va, vb;
    if      (sortKey === 'nome') { va = a.orgao_julgador; vb = b.orgao_julgador; }
    else if (sortKey === 'muni') { va = a.municipio_oj||''; vb = b.municipio_oj||''; }
    else { va = a[sortKey] != null ? a[sortKey] : -1; vb = b[sortKey] != null ? b[sortKey] : -1; }
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb,'pt-BR') : vb.localeCompare(va,'pt-BR');
    return sortDir === 'asc' ? va - vb : vb - va;
  });
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt(v, d) {
  if (v == null) return '–';
  return Number(v).toLocaleString('pt-BR', {minimumFractionDigits: d||1, maximumFractionDigits: d||1});
}
function fmtN(v) {
  if (!v) return '–';
  return Number(v).toLocaleString('pt-BR', {maximumFractionDigits: 0});
}
function iadCls(v) { if (v==null) return 'null'; return v>=100?'good':v>=80?'warn':'bad'; }
function tclCls(v) { if (v==null) return 'null'; return v<=35?'good':v<=50?'warn':'bad'; }
function tipoBadge(t) {
  if (t === 'Vara')             return 'tbadge tb-vara';
  if (t.indexOf('Gabinete')>=0) return 'tbadge tb-gab';
  if (t === 'CEJUSC')           return 'tbadge tb-cejusc';
  return 'tbadge tb-outro';
}
function pontua(iad, tcl) {
  if (iad == null) return false;
  if (iad >= 100.0) return true;
  if (iad >= 90.0 && tcl != null && tcl < 25.0) return true;
  return false;
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  var data = sortedData(filtered());
  buildHead();

  // Título
  var segLbls = Array.from(segs).map(function(s){return SEG_LABEL[s];}).join(' + ');
  document.getElementById('tbl-title').textContent = segLbls.toUpperCase() + ' · ÓRGÃOS JULGADORES';
  document.getElementById('tbl-count').textContent = data.length + ' unidades';

  // KPIs
  var I1=0, I20=0, I3=0, I21=0, PEND=0;
  data.forEach(function(r) {
    I1+=r.ind1||0; I20+=r.ind20||0; I3+=r.ind3||0; I21+=r.ind21||0; PEND+=r.pend_final||0;
  });
  var iadG = (I1+I20)>0 ? (I3+I21)/(I1+I20)*100 : null;
  var tclG = (PEND+I3)>0 ? PEND/(PEND+I3)*100 : null;

  document.getElementById('kpi-grid').innerHTML =
    '<div class="kpi c-blue"><div class="kpi-lbl">Entrada · Distribuição</div><div class="kpi-lbl2">ind1</div><div class="kpi-val">' + fmtN(I1) + '</div></div>' +
    '<div class="kpi c-blue2"><div class="kpi-lbl">Entrada · Redistribuição</div><div class="kpi-lbl2">ind20</div><div class="kpi-val">' + fmtN(I20) + '</div></div>' +
    '<div class="kpi c-red"><div class="kpi-lbl">Saída · Baixa</div><div class="kpi-lbl2">ind3</div><div class="kpi-val">' + fmtN(I3) + '</div></div>' +
    '<div class="kpi c-amber"><div class="kpi-lbl">Saída · Redistribuição</div><div class="kpi-lbl2">ind21</div><div class="kpi-val">' + fmtN(I21) + '</div></div>' +
    '<div class="kpi c-teal"><div class="kpi-lbl">IAD</div><div class="kpi-lbl2">(ind3+ind21)/(ind1+ind20)</div><div class="kpi-val ' + iadCls(iadG) + '">' + (iadG!=null?fmt(iadG)+'%':'–') + '</div><div class="kpi-sub">meta ≥ 100%</div></div>' +
    '<div class="kpi c-purple"><div class="kpi-lbl">TCL</div><div class="kpi-lbl2">ind5/(ind5+ind3)</div><div class="kpi-val ' + tclCls(tclG) + '">' + (tclG!=null?fmt(tclG)+'%':'–') + '</div><div class="kpi-sub">menor = melhor</div></div>';

  // Cards de pontuação
  var nSim    = data.filter(function(r){ return pontua(r.iad, r.tcl); }).length;
  var nTotal  = data.length;
  var indice  = nTotal > 0 ? (nSim / nTotal * 100) : null;
  document.getElementById('pont-bar').innerHTML =
    '<div class="pont-card">' +
      '<span class="pont-icon">🏛️</span>' +
      '<div class="pont-info">' +
        '<span class="pont-lbl">Total de Unidades</span>' +
        '<span class="pont-val">' + nTotal + '</span>' +

      '</div>' +
    '</div>' +
    '<div class="pont-card">' +
      '<span class="pont-icon">✅</span>' +
      '<div class="pont-info">' +
        '<span class="pont-lbl">Unidades que Pontuam</span>' +
        '<span class="pont-val destaque">' + nSim + '</span>' +
        '<span class="pont-sub">IAD ≥ 100% ou IAD ≥ 90% + TCL &lt; 25%</span>' +
      '</div>' +
    '</div>' +
    '<div class="pont-card">' +
      '<span class="pont-icon">📊</span>' +
      '<div class="pont-info">' +
        '<span class="pont-lbl">Índice de Pontuação</span>' +
        '<span class="pont-val destaque">' + (indice!=null ? fmt(indice)+'%' : '–') + '</span>' +
        '<span class="pont-sub">unidades que pontuam / total</span>' +
      '</div>' +
    '</div>';

  // Tabela
  if (data.length === 0) {
    document.getElementById('tbody').innerHTML = '<tr class="empty"><td colspan="10">Nenhuma unidade encontrada.</td></tr>';
    return;
  }

  var maxIAD = Math.max.apply(null, data.map(function(r){return r.iad||0;}).concat([120]));
  var maxTCL = Math.max.apply(null, data.map(function(r){return r.tcl||0;}).concat([100]));

  document.getElementById('tbody').innerHTML = data.map(function(r) {
    var ic = iadCls(r.iad), tc = tclCls(r.tcl);
    var iW = r.iad!=null ? Math.min(r.iad/maxIAD*100,100).toFixed(1) : 0;
    var tW = r.tcl!=null ? Math.min(r.tcl/maxTCL*100,100).toFixed(1) : 0;
    var sim = pontua(r.iad, r.tcl);
    var pontCell = sim
      ? '<span style="display:inline-block;padding:2px 10px;border-radius:4px;font-size:0.72rem;font-weight:700;background:#DCFCE7;color:#16A34A">SIM</span>'

    return '<tr>' +

      '<td class="muni">' + (r.municipio_oj||'–') + '</td>' +

      '<td class="num">'      + fmtN(r.ind21) + '</td>' +
      '<td class="ind-cell"><div class="ind-row"><span class="ind-val ' + ic + '">' + (r.iad!=null?fmt(r.iad)+'%':'–') + '</span><div class="bar"><div class="bar-fill ' + ic + '" style="width:' + iW + '%"></div></div></div></td>' +
      '<td class="ind-cell"><div class="ind-row"><span class="ind-val ' + tc + '">' + (r.tcl!=null?fmt(r.tcl)+'%':'–') + '</span><div class="bar"><div class="bar-fill ' + tc + '" style="width:' + tW + '%"></div></div></div></td>' +
      '<td style="text-align:center">' + pontCell + '</td>' +
      '</tr>';
  }).join('');
}

// ── Init ──────────────────────────────────────────────────────────────────
tipos = new Set(tiposDisponiveis());
buildTipos();
render();
</script>
